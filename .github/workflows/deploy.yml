name: Refresh content and deploy

on:
  push:
    branches: [master, main]
  schedule:
    - cron: '37 7 * * 1' # Every Monday at 07:37 UTC
    - cron: '17 6 * * 0,2-6' # Daily at 06:17 UTC, except Monday
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh updates, writing, and projects
        if: github.event_name != 'schedule' || github.event.schedule == '37 7 * * 1'
        run: python3 scripts/refresh_content.py
      - name: Refresh suggested reading
        run: python3 scripts/refresh_news.py
      - name: Keep the weekly source snapshot
        if: github.event_name == 'schedule'
        run: |
          git add index.html
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Refresh public content [skip ci]'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Build static site
        run: python3 scripts/build_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
